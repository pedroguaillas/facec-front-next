<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f5f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />
    <title>Sin conexión | Facec</title>
    <link rel="icon" href="/icon.svg" />
    <style>
        :root { --bg: #f1f5f9; --surface: #ffffff; --ink-1: #1d293d; --ink-3: #64748b; --line: rgba(15, 23, 42, 0.08); --primary: #005c67; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #0f172a; --surface: #1e293b; --ink-1: #e2e8f0; --ink-3: #94a3b8; --line: rgba(255, 255, 255, 0.08); --primary: #0096a3; }
        }
        * { box-sizing: border-box; }
        html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
        body {
            margin: 0; min-height: 100svh; display: grid; place-items: center;
            padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
            background: var(--bg); color: var(--ink-1);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        main { width: 100%; max-width: 360px; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 32px 24px; }
        img { width: 56px; height: 56px; border-radius: 14px; }
        h1 { font-size: 20px; margin: 20px 0 8px; }
        p { color: var(--ink-3); font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
        button {
            width: 100%; border: 0; border-radius: 10px; padding: 12px 16px; font: inherit; font-weight: 600;
            background: var(--primary); color: #fff; cursor: pointer;
            touch-action: manipulation; user-select: none; -webkit-user-select: none;
            transition: transform 100ms ease-out, opacity 100ms;
        }
        button:active { transform: scale(0.97); opacity: 0.9; }
    </style>
</head>
<body>
    <main>
        <img src="/icon.svg" alt="" />
        <h1>Sin conexión</h1>
        <p>No hay internet en este momento. Para facturar y consultar el SRI se necesita conexión; vuelve a intentar cuando regrese.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
    <script>
        // Vuelve sola a la app en cuanto regresa la conexión
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
